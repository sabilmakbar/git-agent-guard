name: tests
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck
          # excluded: SC1090/SC1091 dynamic source paths, SC2317 trap-invoked
          # cleanup, SC2088 literal tilde matched in command text — all
          # structural false positives here.
          shellcheck -s sh -e SC1090,SC1091,SC2317,SC2088 core/lib.sh core/checks/*.sh dispatcher/dispatch.sh adapters/claude-code/pretooluse.sh install.sh
      - name: run suites
        run: |
          for t in tests/*.sh; do echo "== $t"; "$t"; done
